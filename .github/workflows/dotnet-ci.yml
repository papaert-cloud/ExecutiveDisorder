name: .NET CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  release:
    types: [published]

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        dotnet-version: ['9.0.x']
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ matrix.dotnet-version }}
    
    - name: Restore dependencies
      run: dotnet restore ExecutiveDisorder.sln
    
    - name: Build
      run: dotnet build ExecutiveDisorder.sln --configuration Release --no-restore
    
    - name: Run tests
      run: dotnet test ExecutiveDisorder.sln --configuration Release --no-build --verbosity normal
    
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-${{ matrix.os }}
        path: '**/TestResults/**/*'

  publish-console:
    name: Publish Console App
    needs: build-and-test
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        runtime: [win-x64, linux-x64, osx-x64]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'
    
    - name: Publish Console App
      run: |
        dotnet publish ExecutiveDisorder.Console/ExecutiveDisorder.Console.csproj \
          -c Release \
          -r ${{ matrix.runtime }} \
          --self-contained true \
          -p:PublishSingleFile=true \
          -p:PublishTrimmed=true \
          -o ./publish/${{ matrix.runtime }}
    
    - name: Create archive
      run: |
        cd ./publish/${{ matrix.runtime }}
        if [ "${{ matrix.runtime }}" == "win-x64" ]; then
          zip -r ../../ExecutiveDisorder-Console-${{ matrix.runtime }}.zip .
        else
          tar -czf ../../ExecutiveDisorder-Console-${{ matrix.runtime }}.tar.gz .
        fi
    
    - name: Upload Release Assets
      uses: softprops/action-gh-release@v1
      with:
        files: ./ExecutiveDisorder-Console-${{ matrix.runtime }}.*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-avalonia:
    name: Publish Avalonia GUI
    needs: build-and-test
    if: github.event_name == 'release'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            runtime: win-x64
            ext: zip
          - os: ubuntu-latest
            runtime: linux-x64
            ext: tar.gz
          - os: macos-latest
            runtime: osx-x64
            ext: tar.gz
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'
    
    - name: Publish Avalonia GUI
      run: |
        dotnet publish ExecutiveDisorder.Avalonia/ExecutiveDisorder.Avalonia.csproj \
          -c Release \
          -r ${{ matrix.runtime }} \
          --self-contained true \
          -o ./publish/${{ matrix.runtime }}
    
    - name: Create archive (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        cd ./publish/${{ matrix.runtime }}
        Compress-Archive -Path * -DestinationPath ../../ExecutiveDisorder-GUI-${{ matrix.runtime }}.zip
      shell: pwsh
    
    - name: Create archive (Unix)
      if: matrix.os != 'windows-latest'
      run: |
        cd ./publish/${{ matrix.runtime }}
        tar -czf ../../ExecutiveDisorder-GUI-${{ matrix.runtime }}.tar.gz .
    
    - name: Upload Release Assets
      uses: softprops/action-gh-release@v1
      with:
        files: ./ExecutiveDisorder-GUI-${{ matrix.runtime }}.*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'
    
    - name: Check code formatting
      run: dotnet format ExecutiveDisorder.sln --verify-no-changes --verbosity diagnostic
