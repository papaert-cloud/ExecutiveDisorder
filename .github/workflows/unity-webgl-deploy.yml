name: Unity WebGL Deploy

on:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - 'Assets/**'
  workflow_dispatch:

jobs:
  deploy-flask:
    name: Deploy Flask Backend
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        cd app
        pip install -r requirements.txt
    
    - name: Run Flask tests
      run: |
        cd app
        python -m pytest tests/ || true
      continue-on-error: true
    
    - name: Deploy to Replit
      if: github.ref == 'refs/heads/main'
      run: |
        echo "Flask app automatically deploys on Replit when pushed to main"
        echo "WebGL game available at: https://${{ secrets.REPLIT_DOMAIN }}"

  validate-game-data:
    name: Validate Game JSON Data
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install jq
      run: sudo apt-get update && sudo apt-get install -y jq
    
    - name: Validate JSON files
      run: |
        shopt -s globstar nullglob
        for file in Assets/**/*.json; do
          if [ -f "$file" ]; then
            echo "Validating $file"
            python -m json.tool "$file" > /dev/null
          fi
        done
    
    - name: Count game assets
      run: |
        if [ -f "Assets/cardsjson.json" ]; then
          echo "Decision Cards: $(jq '.cards | length' Assets/cardsjson.json)"
        fi
        if [ -f "Assets/charactersjson.json" ]; then
          echo "Characters: $(jq '.characters | length' Assets/charactersjson.json)"
        fi
        if [ -f "Assets/endingjson.json" ]; then
          echo "Endings: $(jq '.endings | length' Assets/endingjson.json)"
        fi
